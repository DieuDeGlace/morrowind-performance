name: Ragdoll Source Checks

on:
  push:
    paths:
      - '.github/workflows/ragdoll-checks.yml'
      - 'apps/openmw/mwphysics/ragdoll*.hpp'
      - 'apps/openmw_tests/mwphysics/testragdoll*.cpp'
      - 'apps/openmw/mwphysics/itemphysics*'
      - 'apps/openmw/mwlua/worldbindings.cpp'
      - 'apps/openmw_tests/mwphysics/testitemphysics*.cpp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install header dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libopenscenegraph-dev libbullet-dev libboost-dev libgtest-dev libluajit-5.1-dev
      - name: Check actor physics regressions compile
        run: |
          g++ -std=c++20 -fsyntax-only -I. -I/usr/include/bullet apps/openmw_tests/mwphysics/testragdollautorig.cpp apps/openmw_tests/mwphysics/testragdollcontrollers.cpp


      - name: Run automatic rig generation tests against real scene utilities
        run: |
          g++ -std=c++20 -O0 -ffunction-sections -fdata-sections -I. -I/usr/include/bullet \
            apps/openmw_tests/mwphysics/testragdollautorig.cpp \
            components/sceneutil/riggeometry.cpp components/sceneutil/morphgeometry.cpp \
            components/sceneutil/skeleton.cpp components/sceneutil/riggeometryosgaextension.cpp \
            components/debug/debuglog.cpp \
            -Wl,--gc-sections -lgtest_main -lgtest -losg -losgUtil -losgAnimation -losgParticle -lOpenThreads -pthread \
            -o /tmp/ragdoll-autorig-tests
          /tmp/ragdoll-autorig-tests
      - name: Check native item integration compiles
        run: |
          g++ -std=c++20 -fsyntax-only -I. -I/usr/include/bullet -Iextern/sol3 -Iextern/sol_config apps/openmw/mwphysics/itemphysics.cpp apps/openmw/mwphysics/ragdoll.cpp
          g++ -std=c++20 -fsyntax-only -I. -I/usr/include/bullet -Iextern/sol3 -Iextern/sol_config -I/usr/include/luajit-2.1 apps/openmw/mwlua/worldbindings.cpp
      - name: Run native item policy tests
        run: |
          g++ -std=c++20 -I. apps/openmw_tests/mwphysics/testitemphysicsrules.cpp -lgtest_main -lgtest -pthread -o /tmp/item-physics-tests
          /tmp/item-physics-tests

