name: Morph Fitting Audit
on:
  workflow_dispatch:
  push:
    branches: ['codex/morphfit-audit']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install math headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libopenscenegraph-dev
      - name: Compare original and optimized fitting
        run: |
          git show 7d1310e63cf153f424a7e4003d1753f89d852927:apps/openmw/mwphysics/ragdollmorphfit.hpp > /tmp/morphfit-baseline.hpp
          sed -i 's/OPENMW_MWPHYSICS_RAGDOLLMORPHFIT_H/OPENMW_MWPHYSICS_RAGDOLLMORPHFIT_BASELINE_H/g; s/namespace MWPhysics::MorphFit/namespace BaselineMorphFit/' /tmp/morphfit-baseline.hpp
          g++ -std=c++20 -O2 -I. -I/tmp CI/compare-morph-fit.cpp -losg -lOpenThreads -pthread -o /tmp/compare-morph-fit
          /tmp/compare-morph-fit | tee MORPH-FIT-COMPARISON.json
      - uses: actions/upload-artifact@v4
        with:
          name: morph-fit-comparison
          path: MORPH-FIT-COMPARISON.json
          if-no-files-found: error
