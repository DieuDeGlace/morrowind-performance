name: Rendering Regression Checks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rendering-checks.yml'
      - 'components/sceneutil/shadowprojection.hpp'
      - 'files/shaders/compatibility/shadows_fragment.glsl'
      - 'CI/test-shadow-filter-gpu.py'
      - 'components/sceneutil/mwshadowtechnique.*'
      - 'apps/components_tests/sceneutil/shadowprojection.cpp'
      - 'apps/openmw/mwrender/occlusionculling.*'

permissions:
  contents: read

jobs:
  shadow-filter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless GPU test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri
          python -m pip install moderngl==5.12.0 numpy==2.2.6
      - name: Render shadow filter regression fixtures
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python CI/test-shadow-filter-gpu.py --report shadow-filter-gpu.json
      - uses: actions/upload-artifact@v4
        with:
          name: Shadow-filter-GPU-tests
          path: shadow-filter-gpu.json
          if-no-files-found: error

  shadows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install focused test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libopenscenegraph-dev libgtest-dev libboost-dev
      - name: Test cached shadow projections and traversal buffers
        run: |
          g++ -std=c++20 -O2 -I. apps/components_tests/sceneutil/shadowprojection.cpp -lgtest_main -lgtest -losg -lOpenThreads -pthread -o /tmp/shadow-projection-tests
          /tmp/shadow-projection-tests
      - name: Check renderer integration compiles
        run: g++ -std=c++20 -fsyntax-only -I. components/sceneutil/mwshadowtechnique.cpp apps/openmw/mwrender/occlusionculling.cpp
