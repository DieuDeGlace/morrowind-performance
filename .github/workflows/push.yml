name: Windows Performance Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build, test, and package Release
        shell: pwsh
        run: ./CI/build-windows-release.ps1 -Jobs 4
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMW-performance-Windows-x64
          path: release/*.zip
          if-no-files-found: error
