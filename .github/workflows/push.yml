name: Windows Performance Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-filter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless GPU test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri
          python -m pip install moderngl==5.12.0 numpy==2.2.6
      - name: Render shadow filter regression fixtures
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python CI/test-shadow-filter-gpu.py --report shadow-filter-gpu.json
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-shadow-filter-GPU-tests
          path: shadow-filter-gpu.json
          if-no-files-found: error

  windows:
    needs: shadow-filter
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build, test, and package Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./CI/build-windows-release.ps1 -Jobs 4
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMW-performance-Windows-x64
          path: release/*.zip
          if-no-files-found: error

      - name: Preserve release staging and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-release-staging-and-tests
          path: |
            release/
            build-release/*-tests.xml
          if-no-files-found: ignore